# Quackback self-hosted stack: Caddy (HTTPS reverse proxy) + app + Postgres + Redis + S3 storage
#
#   cp .env.example .env     # fill in every value
#   docker compose up -d
#
# Only Caddy publishes host ports (80/443). Everything else lives on the internal network.

name: quackback

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates live here - keep this volume
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - edge

  app:
    image: ghcr.io/quackbackio/quackback:${QUACKBACK_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Core
      BASE_URL: https://${DOMAIN}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (openssl rand -base64 32)}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # One proxy (Caddy) sits in front, so trust exactly one hop for client-IP headers
      TRUSTED_PROXY_HOPS: "1"
      # Object storage (private bucket, files served through the app's /api/storage proxy)
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_FORCE_PATH_STYLE: "true"
      S3_PROXY: "true"
      # Email (configure exactly ONE provider; leave all blank to log emails to the console)
      EMAIL_RESEND_API_KEY: ${EMAIL_RESEND_API_KEY:?Set EMAIL_RESEND_API_KEY in .env}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      # Optional
      SETUP_OWNER_EMAIL: ${SETUP_OWNER_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - backend

  postgres:
    build: ./postgres # official postgres + pg_cron
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-quackback}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  edge: # Caddy <-> app
  backend:
    internal: true # no outbound/inbound internet for db, redis, storage

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data: